<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background / Glow Gradients -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="blastGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield Base with Border -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#030712" stroke="url(#neonGradient)" stroke-width="2" />

  <!-- Radial Blast Glow Background -->
  <circle cx="60" cy="60" r="45" fill="url(#blastGlow)" opacity="0.6" />

  <!-- Outer Hexagonal Ripple Shockwave -->
  <polygon points="60,16 98,38 98,82 60,104 22,82 22,38" 
           fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.75" />

  <!-- Mid Hexagonal Blast Ring -->
  <polygon points="60,26 89,43 89,77 60,94 31,77 31,43" 
           fill="none" stroke="url(#neonGradient)" stroke-width="2.4" filter="url(#glowEffect)" />

  <!-- Radiating Dependency Vector Lines -->
  <line x1="60" y1="26" x2="60" y2="44" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
  <line x1="89" y1="43" x2="74" y2="52" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="89" y1="77" x2="74" y2="68" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="94" x2="60" y2="76" stroke="#fb7185" stroke-width="2" stroke-linecap="round" />
  <line x1="31" y1="77" x2="46" y2="68" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
  <line x1="31" y1="43" x2="46" y2="52" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />

  <!-- Outer Dependency Satellite Nodes -->
  <circle cx="60" cy="26" r="3.5" fill="#38bdf8" filter="url(#glowEffect)" />
  <circle cx="89" cy="43" r="3.5" fill="#a855f7" filter="url(#glowEffect)" />
  <circle cx="89" cy="77" r="3.5" fill="#f43f5e" filter="url(#glowEffect)" />
  <circle cx="60" cy="94" r="3.5" fill="#fb7185" filter="url(#glowEffect)" />
  <circle cx="31" cy="77" r="3.5" fill="#c084fc" filter="url(#glowEffect)" />
  <circle cx="31" cy="43" r="3.5" fill="#22d3ee" filter="url(#glowEffect)" />

  <!-- Inner Code Bracket / Impact Core -->
  <polygon points="60,45 73,53 73,67 60,75 47,67 47,53" 
           fill="#0f172a" stroke="url(#coreGlow)" stroke-width="2.5" filter="url(#glowEffect)" />

  <!-- Central Blast Ripple Nucleus -->
  <circle cx="60" cy="60" r="5" fill="#ffffff" filter="url(#glowEffect)" />
  <circle cx="60" cy="60" r="2.5" fill="#f43f5e" />

  <!-- Stylized Code Impact Chevrons < > -->
  <path d="M 53 56 L 49 60 L 53 64" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 67 56 L 71 60 L 67 64" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
